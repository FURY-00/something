# Jarvis settings. Delete a line to use its default (see jarvis/config.py).

assistant_name: Jarvis
user_title: Sir            # how Jarvis addresses you: Sir, Boss, your name...

llm:
  # Which brain holds the conversation:
  #   ollama    - runs on your laptop, fully offline, free (default)
  #   anthropic - Claude in the cloud: far smarter at engineering, CAD/CAE scripting and
  #               code. Needs internet and an API key (set ANTHROPIC_API_KEY). Paid per use.
  provider: ollama
  # The local model. Any Ollama model with tool support works. Pick by your RAM:
  #    8 GB RAM  -> qwen2.5:3b     (fast, basic)
  #   16 GB RAM  -> qwen2.5:7b     (good default) or llama3.1:8b
  #   GPU 12 GB+ -> qwen2.5:14b    (noticeably smarter)
  #   GPU 24 GB+ -> qwen2.5:32b    (very capable)
  # After changing it run:  ollama pull <model>
  model: qwen2.5:7b
  anthropic_model: claude-opus-5
  anthropic_effort: medium   # low / medium / high: lower answers faster in conversation
  # For "thinking" models (qwen3, gpt-oss, deepseek-r1) set think: false for faster replies.
  think: null
  # Optional: a vision model lets Jarvis look at your screen ("what's on my screen?").
  # e.g. qwen2.5vl:7b, gemma3:4b, llava:7b  (then: ollama pull <model>)
  vision_model: ""
  remember_conversations: true   # remember the gist of each chat for next time

skills:
  # The brain that writes scripts for SolidWorks, COMSOL, Ansys, Blender, Canva and code:
  #   same = follow llm.provider;  ollama = local coder model;  anthropic = Claude (recommended
  #   for serious engineering work: it knows these APIs far better than a laptop-sized model)
  code_provider: same
  code_model: qwen2.5-coder:7b   # local code model (ollama pull qwen2.5-coder:7b); 14b is better
  code_effort: high              # Claude effort for code: high or xhigh
  max_attempts: 4                # write -> run -> fix rounds per task
  # Each application: enabled: auto (use it if installed), true or false
  blender:
    enabled: auto
    executable: ""               # path to blender(.exe) if it isn't found automatically
  solidworks:
    enabled: auto                # Windows only
  comsol:
    enabled: auto
    version: ""                  # e.g. "6.2" if several are installed
  ansys:
    enabled: auto
    executable: ""               # path to the MAPDL executable if it isn't found automatically
  canva:
    enabled: auto                # needs internet; your browser opens once to sign in

wake_word:
  engine: openwakeword     # openwakeword ("Hey Jarvis"), whisper (just say "Jarvis"), enter (push to talk)
  threshold: 0.5           # raise (0.6-0.7) if it wakes up by accident, lower if it misses you
  follow_up_seconds: 6     # keep listening this long after answering, without the wake word

stt:
  # Speech recognition. Bigger = more accurate but slower:
  # tiny.en, base.en, small.en, medium.en, distil-large-v3 (non-English: small, medium, large-v3)
  model: base.en
  device: cpu              # cpu, or cuda for NVIDIA GPUs with CUDA 12 + cuDNN installed

tts:
  engine: piper            # piper (natural voice) or pyttsx3 (built-in system voice)
  # British male voices: en_GB-alan-medium, en_GB-northern_english_male-medium
  # More at https://rhasspy.github.io/piper-samples/  (then run --setup again)
  voice: en_GB-alan-medium
  length_scale: 0.95       # speaking speed: lower = faster

audio:
  input_device: null       # microphone number from: python -m jarvis --list-devices
  output_device: null
  silence_seconds: 1.0     # pause length that means "I've finished talking"
  min_speech_rms: 350      # raise in noisy rooms if Jarvis never stops listening
  chime: true

knowledge:
  # Offline Wikipedia via Kiwix (see README). Example: http://localhost:8080
  kiwix_url: ""

safety:
  confirm_dangerous: true  # ask before shutdown, restart, closing apps...
  allow_shell: false       # let Jarvis run terminal commands (always asks first)

paths:
  documents: ~/Documents/Jarvis
  screenshots: ~/Pictures/Jarvis
  projects: ~/Documents/Jarvis/Projects   # CAD parts, simulations, renders, websites, code
